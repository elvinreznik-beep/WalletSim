import CoreGraphics
import CoreMotion
import Foundation
import Observation

/// Liefert eine geglättete Neigung (-1…1) für den Schimmer auf den Karten.
/// Ohne Bewegungssensor (Simulator) läuft eine langsame Auto-Animation.
@MainActor
@Observable
final class MotionManager {
    static let shared = MotionManager()

    private(set) var tilt: CGPoint = .zero

    private let manager = CMMotionManager()
    @ObservationIgnored private var loopTask: Task<Void, Never>?
    @ObservationIgnored private var baselineY: Double?
    @ObservationIgnored private var simulatedTime: Double = 0

    private init() {}

    func start() {
        guard loopTask == nil else { return }
        if manager.isDeviceMotionAvailable && !manager.isDeviceMotionActive {
            manager.deviceMotionUpdateInterval = 1.0 / 60.0
            manager.startDeviceMotionUpdates()
        }
        loopTask = Task { [weak self] in
            while !Task.isCancelled {
                self?.step()
                try? await Task.sleep(for: .milliseconds(16))
            }
        }
    }

    func stop() {
        loopTask?.cancel()
        loopTask = nil
        if manager.isDeviceMotionActive {
            manager.stopDeviceMotionUpdates()
        }
        baselineY = nil
    }

    private func step() {
        let target: CGPoint
        if let motion = manager.deviceMotion {
            let gravityX = motion.gravity.x
            let gravityY = motion.gravity.y
            // Die Grundhaltung passt sich langsam an, damit der Effekt auf Bewegung reagiert.
            let base = baselineY ?? gravityY
            let newBase = base + (gravityY - base) * 0.02
            baselineY = newBase
            target = CGPoint(x: clamp(gravityX * 1.6), y: clamp((gravityY - newBase) * 3))
        } else {
            simulatedTime += 0.016
            target = CGPoint(x: sin(simulatedTime * 0.8) * 0.6, y: cos(simulatedTime * 0.55) * 0.35)
        }

        let smoothed = CGPoint(
            x: tilt.x + (target.x - tilt.x) * 0.18,
            y: tilt.y + (target.y - tilt.y) * 0.18
        )
        if abs(smoothed.x - tilt.x) > 0.0005 || abs(smoothed.y - tilt.y) > 0.0005 {
            tilt = smoothed
        }
    }

    private func clamp(_ value: Double) -> Double {
        min(max(value, -1), 1)
    }
}

import UIKit

// MARK: - Cache für dekodierte Kartenfotos

final class ImageCache {
    static let shared = ImageCache()

    private let cache = NSCache<NSString, UIImage>()

    private init() {
        cache.countLimit = 40
    }

    func image(for key: String) -> UIImage? {
        cache.object(forKey: key as NSString)
    }

    func store(_ image: UIImage, for key: String) {
        cache.setObject(image, forKey: key as NSString)
    }
}

// MARK: - Fotos für Karten vorbereiten

@MainActor
enum ImageProcessing {
    /// Verkleinert große Fotos und "backt" die Ausrichtung ein.
    static func prepareForCard(_ image: UIImage, maxDimension: CGFloat = 1800) -> UIImage {
        let size = image.size
        let longest = max(size.width, size.height)
        guard longest > 0 else { return image }
        let factor = min(1, maxDimension / longest)
        let target = CGSize(width: (size.width * factor).rounded(), height: (size.height * factor).rounded())

        let format = UIGraphicsImageRendererFormat()
        format.scale = 1
        format.opaque = true
        let renderer = UIGraphicsImageRenderer(size: target, format: format)
        return renderer.image { _ in
            image.draw(in: CGRect(origin: .zero, size: target))
        }
    }
}

// MARK: - Prozedurale Texturen (gebürstetes Metall, Körnung)

struct SeededGenerator: RandomNumberGenerator {
    private var state: UInt64

    init(seed: UInt64) {
        state = seed == 0 ? 0x9E3779B97F4A7C15 : seed
    }

    mutating func next() -> UInt64 {
        state = state &* 6364136223846793005 &+ 1442695040888963407
        var z = state
        z = (z ^ (z >> 33)) &* 0xFF51AFD7ED558CCD
        z = (z ^ (z >> 33)) &* 0xC4CEB9FE1A85EC53
        return z ^ (z >> 33)
    }
}

@MainActor
enum TextureFactory {
    static let brushedMetal: UIImage = makeBrushedMetal(width: 600, height: 380)
    static let grain: UIImage = makeGrain(size: 256)

    private static func makeBrushedMetal(width: Int, height: Int) -> UIImage {
        var generator = SeededGenerator(seed: 0xC0FFEE)
        var pixels = [UInt8](repeating: 0, count: width * height)
        var row = [Double](repeating: 0, count: width)
        let radius = 14

        for y in 0..<height {
            let base = Double.random(in: 0.36...0.64, using: &generator)
            for x in 0..<width {
                row[x] = base + Double.random(in: -0.24...0.24, using: &generator)
            }
            // Horizontaler Weichzeichner erzeugt die typischen Schleifspuren.
            var sum = 0.0
            var count = 0
            for x in 0..<min(radius, width) {
                sum += row[x]
                count += 1
            }
            for x in 0..<width {
                let addIndex = x + radius
                if addIndex < width {
                    sum += row[addIndex]
                    count += 1
                }
                let removeIndex = x - radius - 1
                if removeIndex >= 0 {
                    sum -= row[removeIndex]
                    count -= 1
                }
                let value = min(max(sum / Double(max(count, 1)), 0), 1)
                pixels[y * width + x] = UInt8(value * 255)
            }
        }
        return grayImage(pixels: pixels, width: width, height: height, scale: 1)
    }

    private static func makeGrain(size: Int) -> UIImage {
        var generator = SeededGenerator(seed: 0xBADA55)
        var pixels = [UInt8](repeating: 0, count: size * size)
        for index in pixels.indices {
            pixels[index] = UInt8.random(in: 70...185, using: &generator)
        }
        return grayImage(pixels: pixels, width: size, height: size, scale: 2)
    }

    private static func grayImage(pixels: [UInt8], width: Int, height: Int, scale: CGFloat) -> UIImage {
        let data = Data(pixels) as CFData
        guard let provider = CGDataProvider(data: data),
              let cgImage = CGImage(
                width: width,
                height: height,
                bitsPerComponent: 8,
                bitsPerPixel: 8,
                bytesPerRow: width,
                space: CGColorSpaceCreateDeviceGray(),
                bitmapInfo: CGBitmapInfo(rawValue: CGImageAlphaInfo.none.rawValue),
                provider: provider,
                decode: nil,
                shouldInterpolate: true,
                intent: .defaultIntent
              )
        else { return UIImage() }
        return UIImage(cgImage: cgImage, scale: scale, orientation: .up)
    }
}

import Foundation
import LocalAuthentication

enum AuthResult {
    case success
    case failure(String)
    /// Gerät hat keine Sperre/Beschreibung fehlt – Sperre kann nicht genutzt werden.
    case unavailable(String)
}

@MainActor
enum BiometricAuth {
    /// Ohne diesen Info.plist-Eintrag darf die App Face ID nicht nutzen.
    static var hasUsageDescription: Bool {
        Bundle.main.object(forInfoDictionaryKey: "NSFaceIDUsageDescription") != nil
    }

    static var biometryName: String {
        let context = LAContext()
        _ = context.canEvaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, error: nil)
        switch context.biometryType {
        case .faceID: return "Face ID"
        case .touchID: return "Touch ID"
        case .opticID: return "Optic ID"
        default: return "Gerätecode"
        }
    }

    static func authenticate(reason: String) async -> AuthResult {
        guard hasUsageDescription else {
            return .unavailable("Der Eintrag „Privacy – Face ID Usage Description“ fehlt im Xcode-Projekt (siehe Anleitung).")
        }

        let context = LAContext()
        context.localizedCancelTitle = "Abbrechen"
        var error: NSError?
        guard context.canEvaluatePolicy(.deviceOwnerAuthentication, error: &error) else {
            return .unavailable("Auf diesem Gerät ist kein Code bzw. kein Face ID eingerichtet.")
        }

        do {
            let success = try await context.evaluatePolicy(.deviceOwnerAuthentication, localizedReason: reason)
            return success ? .success : .failure("Entsperren fehlgeschlagen.")
        } catch let laError as LAError where laError.code == .userCancel || laError.code == .appCancel || laError.code == .systemCancel {
            return .failure("Entsperren abgebrochen.")
        } catch {
            return .failure("Entsperren fehlgeschlagen. Versuch es noch einmal.")
        }
    }
}

