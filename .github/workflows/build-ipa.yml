enum CardStyleKind: String, CaseIterable, Identifiable {
    case preset
    case gradient
    case photo

    var id: String { rawValue }

    var title: String {
        switch self {
        case .preset: "Vorlage"
        case .gradient: "Verlauf"
        case .photo: "Foto"
        }
    }
}

/// Alles, was zum Zeichnen einer Karte nötig ist – unabhängig von SwiftData.
/// So nutzen Wallet, Editor-Vorschau und Thumbnails denselben Renderer.
struct CardFace {
    var title: String = ""
    var holderName: String = ""
    var last4: String = "0000"
    var expiryMonth: Int = 1
    var expiryYear: Int = 2030
    var networkLabel: String = ""
    var kind: CardStyleKind = .preset
    var preset: CardPreset = .obsidianMetal
    var gradientStart: Color = Color(hex: "#2B5876")
    var gradientEnd: Color = Color(hex: "#0B1A2E")
    var gradientAngle: Double = 135
    var gradientBrushed: Bool = false
    var image: UIImage?
    var imageScale: CGFloat = 1
    var imageOffset: CGSize = .zero
    var darkText: Bool = false

    var foreground: Color {
        switch kind {
        case .preset:
            preset.textColor
        case .gradient, .photo:
            darkText ? Color(hex: "#1D1D1F") : Color(hex: "#F5F5F7")
        }
    }

    var accent: Color {
        kind == .preset ? preset.accentColor : foreground
    }

    var isLightSurface: Bool {
        kind == .preset ? preset.isLightSurface : darkText
    }

    var holoIntensity: Double {
        switch kind {
        case .preset: preset.holoIntensity
        case .gradient: 0.22
        case .photo: 0.12
        }
    }

    var specularIntensity: Double {
        switch kind {
        case .preset: preset.specularIntensity
        case .gradient: 0.55
        case .photo: 0.4
        }
    }

    var expiryText: String {
        String(format: "%02ld/%02ld", expiryMonth, expiryYear % 100)
    }

    var displayHolder: String {
        let trimmed = holderName.trimmingCharacters(in: .whitespacesAndNewlines)
        return trimmed.isEmpty ? "DEIN NAME" : trimmed.uppercased()
    }

    var displayLast4: String {
        last4.isEmpty ? "0000" : last4
    }

    static func preview(for preset: CardPreset) -> CardFace {
        CardFace(title: preset.displayName, kind: .preset, preset: preset)
    }
}

import Foundation
import SwiftData
import SwiftUI

struct MonthlySpending: Identifiable {
    let month: Date
    let total: Double
    var id: Date { month }
}

@MainActor
@Observable
final class CardDetailViewModel {
    var showingAddPurchase = false
    var showingDeleteConfirm = false

    func sortedTransactions(for card: Card) -> [CardTransaction] {
        card.transactions.sorted { $0.date > $1.date }
    }

    /// Summe pro Monat für die letzten `months` Monate (inkl. Monate ohne Umsatz).
    func monthlySpending(for card: Card, months: Int = 6) -> [MonthlySpending] {
        let calendar = Calendar.current
        guard let currentMonth = calendar.dateInterval(of: .month, for: Date())?.start else { return [] }

        var result: [MonthlySpending] = []
        for offset in stride(from: months - 1, through: 0, by: -1) {
            guard let start = calendar.date(byAdding: .month, value: -offset, to: currentMonth),
                  let end = calendar.date(byAdding: .month, value: 1, to: start) else { continue }
            let total = card.transactions
                .filter { $0.date >= start && $0.date < end }
                .reduce(0.0) { $0 + $1.amount }
            result.append(MonthlySpending(month: start, total: total))
        }
        return result
    }

    func spendingThisMonth(for card: Card) -> Double {
        monthlySpending(for: card, months: 1).first?.total ?? 0
    }

    func delete(_ transaction: CardTransaction, from card: Card, in context: ModelContext) {
        withAnimation(.snappy) {
            card.balance = max(0, card.balance - transaction.amount)
            card.transactions.removeAll { $0.id == transaction.id }
            context.delete(transaction)
        }
        try? context.save()
        Haptics.impact(.light)
    }
}

import Foundation
import SwiftUI

@MainActor
@Observable
final class AppLockViewModel {
    private(set) var isEnabled: Bool
    private(set) var isLocked: Bool
    private(set) var isAuthenticating = false
    var errorMessage: String?

    @ObservationIgnored private var unlockWhenActive = false

    init() {
        let enabled = UserDefaults.standard.bool(forKey: AppSettings.lockKey)
        isEnabled = enabled
        isLocked = enabled
    }

    func handleScenePhase(_ phase: ScenePhase) {
        switch phase {
        case .background:
            if isEnabled {
                isLocked = true
                unlockWhenActive = true
            }
        case .active:
            // Nur nach echtem Hintergrund neu fragen – sonst Endlosschleife nach "Abbrechen".
            if unlockWhenActive {
                unlockWhenActive = false
                Task { await unlock() }
            }
        default:
            break
        }
    }

    func unlock() async {
        guard isLocked, !isAuthenticating else { return }
        isAuthenticating = true
        let result = await BiometricAuth.authenticate(reason: "Entsperre Wallet Sim.")
        isAuthenticating = false

        switch result {
        case .success:
            errorMessage = nil
            withAnimation(.easeOut(duration: 0.25)) {
                isLocked = false
            }
        case .failure(let message):
            errorMessage = message
        case .unavailable(let message):
            // Sicherheitsventil: Ohne Face ID/Code würde man sich sonst aussperren.
            errorMessage = message
            disable()
            withAnimation(.easeOut(duration: 0.25)) {
                isLocked = false
            }
        }
    }

    func setEnabled(_ enabled: Bool) async {
        guard enabled != isEnabled else { return }
        if enabled {
            let result = await BiometricAuth.authenticate(reason: "Bestätige, um die Sperre einzuschalten.")
            switch result {
            case .success:
                errorMessage = nil
            case .failure(let message), .unavailable(let message):
                errorMessage = message
                return
            }
        }
        isEnabled = enabled
        UserDefaults.standard.set(enabled, forKey: AppSettings.lockKey)
        Haptics.success()
    }

    private func disable() {
        isEnabled = false
        UserDefaults.standard.set(false, forKey: AppSettings.lockKey)
    }
}

import Foundation
import SwiftData
import SwiftUI

@MainActor
@Observable
final class PurchaseViewModel {
    var merchant = ""
    var amountText = ""
    var category: TransactionCategory = .shopping
    var date = Date()

    var amount: Double? {
        MoneyParser.parse(amountText)
    }

    var isValid: Bool {
        let hasMerchant = !merchant.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty
        let hasAmount = (amount ?? 0) > 0
        return hasMerchant && hasAmount
    }

    func exceedsLimit(for card: Card) -> Bool {
        guard let value = amount else { return false }
        return value > card.availableCredit
    }

    func selectCategory(_ newCategory: TransactionCategory) {
        category = newCategory
        Haptics.selection()
    }

    func save(to card: Card, in context: ModelContext) {
        guard isValid, let value = amount else { return }
        let transaction = CardTransaction(
            merchant: merchant.trimmingCharacters(in: .whitespacesAndNewlines),
            amount: value,
            date: date,
            category: category
        )
        context.insert(transaction)
        card.transactions.append(transaction)
        card.balance += value
        try? context.save()
        Haptics.success()
    }
}

import PhotosUI
import SwiftData
import SwiftUI
import UIKit

@MainActor
@Observable
final class CardEditorViewModel {
    let editingCard: Card?

    // Kartendaten
    var title: String
    var holderName: String
    var last4: String
    var expiryMonth: Int
    var expiryYear: Int
    var networkLabel: String

    // Design
    var styleKind: CardStyleKind
    var preset: CardPreset
    var gradientStart: Color
    var gradientEnd: Color
    var gradientAngle: Double
    var gradientBrushed: Bool
    var darkText: Bool

    // Foto
    var image: UIImage?
    var imageScale: CGFloat
    var imageOffset: CGSize
    var isLoadingImage = false
    var imageError: String?
    private var imageChanged = false

    // Guthaben (als Text, damit Komma-Eingaben sauber funktionieren)
    var creditLimitText: String
    var balanceText: String

    init(card: Card?) {
        editingCard = card
        if let card {
            title = card.title
            holderName = card.holderName
            last4 = card.last4
            expiryMonth = card.expiryMonth
            expiryYear = card.expiryYear
            networkLabel = card.networkLabel
            styleKind = card.styleKind
            preset = card.preset
            gradientStart = Color(hex: card.gradientStartHex)
            gradientEnd = Color(hex: card.gradientEndHex)
            gradientAngle = card.gradientAngle
            gradientBrushed = card.gradientBrushed
            darkText = card.darkText
            image = card.cachedImage
            imageScale = CGFloat(card.imageScale)
            imageOffset = CGSize(width: card.imageOffsetX, height: card.imageOffsetY)
            creditLimitText = MoneyParser.editString(card.creditLimit)
            balanceText = MoneyParser.editString(card.balance)
        } else {
            let now = Calendar.current.dateComponents([.year, .month], from: Date())
            title = "Reserve"
            holderName = ""
            last4 = CardEditorViewModel.randomLast4()
            expiryMonth = now.month ?? 1
            expiryYear = (now.year ?? 2026) + 4
            networkLabel = "Prestige"
            styleKind = .preset
            preset = .obsidianMetal
            gradientStart = Color(hex: "#2B5876")
            gradientEnd = Color(hex: "#0B1A2E")
            gradientAngle = 135
            gradientBrushed = false
            darkText = false
            image = nil
            imageScale = 1
            imageOffset = .zero
            creditLimitText = "25000"
            balanceText = "0"
        }
    }

    // MARK: Abgeleitete Werte

    var isNew: Bool { editingCard == nil }

    var creditLimit: Double? { MoneyParser.parse(creditLimitText) }

    var balance: Double? {
        balanceText.trimmingCharacters(in: .whitespaces).isEmpty ? 0 : MoneyParser.parse(balanceText)
    }

    var yearRange: [Int] {
        let current = Calendar.current.component(.year, from: Date())
        let lower = min(current, expiryYear)
        return Array(lower...(current + 12))
    }

    var validationMessage: String? {
        if last4.count != 4 { return "Die Kartennummer-Endung braucht genau 4 Ziffern." }
        if creditLimit == nil { return "Gib einen gültigen Kreditrahmen ein." }
        if balance == nil { return "Gib einen gültigen Saldo ein." }
        if styleKind == .photo && image == nil { return "Wähle ein Foto aus oder nutze eine Vorlage." }
        return nil
    }

    var isValid: Bool { validationMessage == nil }

    var previewFace: CardFace {
        CardFace(
            title: title,
            holderName: holderName,
            last4: last4,
            expiryMonth: expiryMonth,
            expiryYear: expiryYear,
            networkLabel: networkLabel,
            kind: styleKind,
            preset: preset,
            gradientStart: gradientStart,
            gradientEnd: gradientEnd,
            gradientAngle: gradientAngle,
            gradientBrushed: gradientBrushed,
            image: image,
            imageScale: imageScale,
            imageOffset: imageOffset,
            darkText: darkText
        )
    }

    // MARK: Aktionen

    static func randomLast4() -> String {
        String(format: "%04ld", Int.random(in: 0...9999))
    }

    func randomizeLast4() {
        last4 = CardEditorViewModel.randomLast4()
        Haptics.selection()
    }

    /// Erlaubt nur bis zu 4 Ziffern.
    func sanitizeLast4(_ value: String) {
        let digits: ClosedRange<Character> = "0"..."9"
        let filtered = String(value.filter { digits.contains($0) }.prefix(4))
        if filtered != value {
            last4 = filtered
        }
    }

    func selectPreset(_ newPreset: CardPreset) {
        preset = newPreset
        Haptics.selection()
    }

    func randomizeGradient() {
        let hue = Double.random(in: 0...1)
        let secondHue = (hue + Double.random(in: 0.06...0.22)).truncatingRemainder(dividingBy: 1)
        gradientStart = Color(hue: hue, saturation: .random(in: 0.55...0.9), brightness: .random(in: 0.55...0.9))
        gradientEnd = Color(hue: secondHue, saturation: .random(in: 0.6...0.95), brightness: .random(in: 0.16...0.42))
        gradientAngle = [45.0, 90, 120, 135, 160, 200, 225].randomElement() ?? 135
        darkText = false
        Haptics.selection()
    }

    func loadImage(from item: PhotosPickerItem?) async {
        guard let item else { return }
        isLoadingImage = true
        imageError = nil
        defer { isLoadingImage = false }

        do {
            guard let data = try await item.loadTransferable(type: Data.self),
                  let loaded = UIImage(data: data) else {
                imageError = "Das Foto konnte nicht geladen werden."
                return
            }
            image = ImageProcessing.prepareForCard(loaded)
            imageScale = 1
            imageOffset = .zero
            imageChanged = true
            styleKind = .photo
            Haptics.success()
        } catch {
            imageError = "Das Foto konnte nicht geladen werden."
        }
    }

    func removeImage() {
        image = nil
        imageScale = 1
        imageOffset = .zero
        imageChanged = true
    }

    func save(in context: ModelContext, nextSortIndex: Int) {
        guard isValid else { return }
        let card = editingCard ?? Card()

        card.title = title.trimmingCharacters(in: .whitespacesAndNewlines)
        card.holderName = holderName.trimmingCharacters(in: .whitespacesAndNewlines)
        card.last4 = last4
        card.expiryMonth = expiryMonth
        card.expiryYear = expiryYear
        card.networkLabel = networkLabel.trimmingCharacters(in: .whitespacesAndNewlines)

        card.styleKind = styleKind
        card.preset = preset
        card.gradientStartHex = HexColor.hex(from: gradientStart)
        card.gradientEndHex = HexColor.hex(from: gradientEnd)
        card.gradientAngle = gradientAngle
        card.gradientBrushed = gradientBrushed
        card.darkText = darkText

        if imageChanged {
            card.imageData = image?.jpegData(compressionQuality: 0.85)
            card.imageToken = image == nil ? "" : UUID().uuidString
        }
        card.imageScale = Double(imageScale)
        card.imageOffsetX = Double(imageOffset.width)
        card.imageOffsetY = Double(imageOffset.height)

        card.creditLimit = creditLimit ?? 0
        card.balance = balance ?? 0

        if editingCard == nil {
            card.sortIndex = nextSortIndex
            context.insert(card)
        }
        try? context.save()
        Haptics.success()
    }
}

import SwiftData
import SwiftUI

enum EditorTarget: Identifiable {
    case new
    case edit(Card)

    var id: String {
        switch self {
        case .new: "new"
        case .edit(let card): card.id.uuidString
        }
    }
}

@MainActor
@Observable
final class WalletViewModel {
    var selectedCardID: UUID?
    var editorTarget: EditorTarget?
    var showingSettings = false
    var showingManage = false

    private let selectionAnimation = Animation.spring(response: 0.52, dampingFraction: 0.84)

    // MARK: Auswahl

    func toggleSelection(_ card: Card) {
        Haptics.impact(.light)
        withAnimation(selectionAnimation) {
            selectedCardID = selectedCardID == card.id ? nil : card.id
        }
    }

    func deselect() {
        guard selectedCardID != nil else { return }
        Haptics.impact(.light)
        withAnimation(selectionAnimation) {
            selectedCardID = nil
        }
    }

    // MARK: Editor

    func startNewCard() {
        Haptics.selection()
        editorTarget = .new
    }

    func edit(_ card: Card) {
        editorTarget = .edit(card)
    }

    func nextSortIndex(for cards: [Card]) -> Int {
        (cards.map(\.sortIndex).max() ?? -1) + 1
    }

    // MARK: Daten

    func delete(_ card: Card, in context: ModelContext) {
        let wasSelected = selectedCardID == card.id
        if wasSelected {
            withAnimation(selectionAnimation) {
                selectedCardID = nil
            }
        }
        Task {
            // Erst die Animation ausspielen, dann löschen – sonst greift die Detailansicht ins Leere.
            if wasSelected {
                try? await Task.sleep(for: .milliseconds(450))
            }
            context.delete(card)
            try? context.save()
            Haptics.warning()
        }
    }

    func deleteAll(_ cards: [Card], in context: ModelContext) {
        selectedCardID = nil
        for card in cards {
            context.delete(card)
        }
        try? context.save()
        Haptics.warning()
    }

    func move(_ cards: [Card], from source: IndexSet, to destination: Int, in context: ModelContext) {
        var reordered = cards
        reordered.move(fromOffsets: source, toOffset: destination)
        for (index, card) in reordered.enumerated() {
            card.sortIndex = index
        }
        try? context.save()
        Haptics.selection()
    }

    func loadSampleData(into context: ModelContext, existing cards: [Card]) {
        SampleData.insert(into: context, startIndex: nextSortIndex(for: cards))
        try? context.save()
        Haptics.success()
    }
}

