                                    RoundedRectangle(cornerRadius: 112 * CardMetrics.cornerRatio + 3, style: .continuous)
                                        .strokeBorder(isSelected ? Color.accentColor : Color.clear, lineWidth: 2)
                                        .padding(-3)
