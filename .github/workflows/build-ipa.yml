  bundleIdPrefix: com.walletsim
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WalletSim:
    type: application
    platform: iOS
    sources:
      - path: WalletSim
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Wallet Sim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Entsperrt Wallet Sim.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
