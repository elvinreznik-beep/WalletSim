import SwiftUI

struct ChipView: View {
    var body: some View {
        GeometryReader { geo in
            let width = geo.size.width
            let shape = RoundedRectangle(cornerRadius: width * 0.18, style: .continuous)
            ZStack {
                shape.fill(
                    LinearGradient(
                        colors: [
                            Color(hex: "#EBD290"),
                            Color(hex: "#C9A24E"),
                            Color(hex: "#F5E3AA"),
                            Color(hex: "#B48A3A")
                        ],
                        startPoint: .topLeading,
                        endPoint: .bottomTrailing
                    )
                )
                ChipContactsShape()
                    .stroke(Color(hex: "#7A5A1E").opacity(0.55), lineWidth: max(0.5, width * 0.025))
                shape.strokeBorder(Color(hex: "#8C6A2A").opacity(0.6), lineWidth: max(0.5, width * 0.02))
            }
        }
    }
}

/// Stilisierte Kontaktflächen eines EMV-Chips.
struct ChipContactsShape: Shape {
    func path(in rect: CGRect) -> Path {
        var path = Path()
        let w = rect.width
        let h = rect.height
        let inner = CGRect(x: rect.minX + w * 0.35, y: rect.minY + h * 0.26, width: w * 0.30, height: h * 0.48)
        path.addRoundedRect(in: inner, cornerSize: CGSize(width: w * 0.05, height: w * 0.05))

        for fraction in [0.36, 0.64] {
            let y = rect.minY + h * fraction
            path.move(to: CGPoint(x: rect.minX, y: y))
            path.addLine(to: CGPoint(x: inner.minX, y: y))
            path.move(to: CGPoint(x: inner.maxX, y: y))
            path.addLine(to: CGPoint(x: rect.maxX, y: y))
        }

        path.move(to: CGPoint(x: rect.midX, y: rect.minY))
        path.addLine(to: CGPoint(x: rect.midX, y: inner.minY))
        path.move(to: CGPoint(x: rect.midX, y: inner.maxY))
        path.addLine(to: CGPoint(x: rect.midX, y: rect.maxY))
        return path
    }
}

/// Feine diagonale Linien als Muster (Emerald-Vorlage).
struct DiagonalLinesShape: Shape {
    var spacing: CGFloat

    func path(in rect: CGRect) -> Path {
        var path = Path()
        let step = max(spacing, 2)
        var x = rect.minX - rect.height
        while x < rect.maxX {
            path.move(to: CGPoint(x: x, y: rect.maxY))
            path.addLine(to: CGPoint(x: x + rect.height, y: rect.minY))
            x += step
        }
        return path
    }
}

import SwiftUI

/// Liest nur hier die Neigung – so wird bei Bewegung nur diese Ebene neu gezeichnet,
/// nicht die ganze Karte.
struct HolographicOverlay: View {
    let holo: Double
    let specular: Double
    let size: CGSize
    let isInteractive: Bool

    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private static let rainbow: [Color] = [
        Color(red: 1.00, green: 0.45, blue: 0.75),
        Color(red: 1.00, green: 0.86, blue: 0.40),
        Color(red: 0.45, green: 1.00, blue: 0.78),
        Color(red: 0.35, green: 0.75, blue: 1.00),
        Color(red: 0.76, green: 0.50, blue: 1.00),
        Color(red: 1.00, green: 0.45, blue: 0.75)
    ]

    var body: some View {
        let tilt = (isInteractive && !reduceMotion) ? MotionManager.shared.tilt : CGPoint(x: 0.15, y: -0.1)
        let shift = tilt.x * 0.55 + tilt.y * 0.25

        ZStack {
            // Irisierender Film
            LinearGradient(
                colors: Self.rainbow,
                startPoint: UnitPoint(x: -0.6 + tilt.x * 0.7, y: -0.4 + tilt.y * 0.5),
                endPoint: UnitPoint(x: 1.6 + tilt.x * 0.7, y: 1.4 + tilt.y * 0.5)
            )
            .blendMode(.overlay)
            .opacity(holo)

            // Wandernder Lichtstreifen
            LinearGradient(
                stops: [
                    .init(color: .white.opacity(0), location: 0.30),
                    .init(color: .white.opacity(0.6), location: 0.50),
                    .init(color: .white.opacity(0), location: 0.70)
                ],
                startPoint: UnitPoint(x: -0.4 + shift, y: -0.2 + shift * 0.4),
                endPoint: UnitPoint(x: 1.0 + shift, y: 1.2 + shift * 0.4)
            )
            .blendMode(.softLight)
            .opacity(specular)

            // Glanzpunkt
            RadialGradient(
                colors: [.white.opacity(0.5), .white.opacity(0)],
                center: UnitPoint(x: 0.5 + tilt.x * 0.6, y: 0.25 + tilt.y * 0.6),
                startRadius: 0,
                endRadius: max(size.width * 0.75, 1)
            )
            .blendMode(.screen)
            .opacity(specular * 0.35)
        }
        .allowsHitTesting(false)
    }
}

import SwiftUI
import UIKit

struct CardBackgroundView: View {
    let face: CardFace
    let size: CGSize

    var body: some View {
        switch face.kind {
        case .preset:
            PresetBackground(preset: face.preset, size: size)
        case .gradient:
            GradientBackground(
                start: face.gradientStart,
                end: face.gradientEnd,
                angle: face.gradientAngle,
                brushed: face.gradientBrushed
            )
        case .photo:
            if let image = face.image {
                CardImageLayer(image: image, scale: face.imageScale, offset: face.imageOffset)
                    .overlay {
                        // Leichte Abdunklung unten, damit helle Schrift lesbar bleibt.
                        LinearGradient(
                            colors: [.black.opacity(0), .black.opacity(face.darkText ? 0 : 0.35)],
                            startPoint: .top,
                            endPoint: .bottom
                        )
                    }
            } else {
                PhotoPlaceholderBackground()
            }
        }
    }
}

// MARK: - Vorlagen

struct PresetBackground: View {
    let preset: CardPreset
    let size: CGSize

    var body: some View {
        LinearGradient(colors: preset.gradientColors, startPoint: .topLeading, endPoint: .bottomTrailing)
            .overlay { finishLayer }
            .overlay { decoration }
    }

    @ViewBuilder
    private var finishLayer: some View {
        switch preset.finish {
        case .brushed:
            Image(uiImage: TextureFactory.brushedMetal)
                .resizable()
                .blendMode(.overlay)
                .opacity(preset.textureOpacity)
        case .grain:
            Image(uiImage: TextureFactory.grain)
                .resizable(resizingMode: .tile)
                .blendMode(.softLight)
                .opacity(preset.textureOpacity)
        case .gloss:
            LinearGradient(
                colors: [.white.opacity(0.26), .white.opacity(0), .white.opacity(0.08), .white.opacity(0)],
                startPoint: .topLeading,
                endPoint: .bottomTrailing
            )
        }
    }

    @ViewBuilder
    private var decoration: some View {
        let w = size.width
        switch preset {
        case .midnightReserve:
            RoundedRectangle(cornerRadius: w * 0.035, style: .continuous)
                .strokeBorder(Color(hex: "#C9A45C").opacity(0.5), lineWidth: max(0.5, w * 0.0028))
                .padding(w * 0.028)
        case .sapphireBlue:
            ZStack {
                ForEach(0..<6, id: \.self) { ring in
                    let diameter = w * (0.45 + CGFloat(ring) * 0.17)
                    Circle()
                        .stroke(Color.white.opacity(0.07), lineWidth: max(0.5, w * 0.004))
                        .frame(width: diameter, height: diameter)
                }
            }
            .offset(x: w * 0.38, y: w * 0.08)
        case .emerald:
            DiagonalLinesShape(spacing: max(3, w * 0.022))
                .stroke(Color.white.opacity(0.05), lineWidth: max(0.5, w * 0.002))
        default:
            EmptyView()
        }
    }
}

// MARK: - Eigener Verlauf

struct GradientBackground: View {
    let start: Color
    let end: Color
    let angle: Double
    let brushed: Bool

    var body: some View {
        let points = GradientMath.points(for: angle)
        LinearGradient(colors: [start, end], startPoint: points.start, endPoint: points.end)
            .overlay {
                LinearGradient(
                    colors: [.white.opacity(0.18), .white.opacity(0), .black.opacity(0.18)],
                    startPoint: .top,
                    endPoint: .bottom
                )
                .blendMode(.softLight)
            }
            .overlay {
                if brushed {
                    Image(uiImage: TextureFactory.brushedMetal)
                        .resizable()
                        .blendMode(.overlay)
                        .opacity(0.4)
                }
            }
    }
}

// MARK: - Foto

/// Zeigt ein Foto mit Zoom/Versatz. `offset` ist relativ zur Kartenbreite,
/// damit es in jeder Größe (Wallet, Editor, Thumbnail) gleich aussieht.
struct CardImageLayer: View {
    let image: UIImage
    let scale: CGFloat
    let offset: CGSize

    var body: some View {
        GeometryReader { geo in
            let size = geo.size
            Image(uiImage: image)
                .resizable()
                .scaledToFill()
                .frame(width: size.width, height: size.height)
                .scaleEffect(scale)
                .offset(x: offset.width * size.width, y: offset.height * size.width)
                .frame(width: size.width, height: size.height)
                .clipped()
        }
    }
}

struct PhotoPlaceholderBackground: View {
    var body: some View {
        LinearGradient(
            colors: [Color(hex: "#3A3A3C"), Color(hex: "#1C1C1E")],
            startPoint: .topLeading,
            endPoint: .bottomTrailing
        )
        .overlay {
            Image(systemName: "photo")
                .font(.system(size: 28, weight: .light))
                .foregroundStyle(.white.opacity(0.25))
        }
    }
}

import SwiftUI

/// Die komplette Karte. Wird überall genutzt: Wallet-Stapel, Editor, Thumbnails.
struct CardView: View {
    let face: CardFace
    var isInteractive: Bool = true
    var showsDetails: Bool = true

    var body: some View {
        GeometryReader { geo in
            let size = geo.size
            let shape = RoundedRectangle(cornerRadius: size.width * CardMetrics.cornerRatio, style: .continuous)

            CardBackgroundView(face: face, size: size)
                .frame(width: size.width, height: size.height)
                .overlay {
                    HolographicOverlay(
                        holo: face.holoIntensity,
                        specular: face.specularIntensity,
                        size: size,
                        isInteractive: isInteractive
                    )
                }
                .overlay {
                    CardContentView(face: face, size: size, showsDetails: showsDetails)
                }
                .clipShape(shape)
                .overlay {
                    shape.strokeBorder(edgeGradient, lineWidth: max(0.5, size.width * 0.0035))
                }
                .compositingGroup()
                .shadow(color: .black.opacity(0.45), radius: size.width * 0.03, x: 0, y: size.width * 0.02)
        }
        .aspectRatio(CardMetrics.aspectRatio, contentMode: .fit)
        .accessibilityElement(children: .ignore)
        .accessibilityLabel(Text(verbatim: "\(face.title), Karte endet auf \(face.displayLast4)"))
    }

    private var edgeGradient: LinearGradient {
        LinearGradient(
            colors: face.isLightSurface
                ? [.white.opacity(0.9), .white.opacity(0.2), .black.opacity(0.25)]
                : [.white.opacity(0.35), .white.opacity(0.05), .black.opacity(0.4)],
            startPoint: .topLeading,
            endPoint: .bottomTrailing
        )
    }
}

struct CardContentView: View {
    let face: CardFace
    let size: CGSize
    var showsDetails: Bool = true

    private func scaled(_ factor: CGFloat) -> CGFloat {
        max(1, size.width * factor)
    }

    var body: some View {
        VStack(alignment: .leading, spacing: 0) {
            HStack(alignment: .top) {
                Text(verbatim: face.title.uppercased())
                    .font(.system(size: scaled(0.05), weight: .semibold))
                    .tracking(scaled(0.008))
                    .foregroundStyle(face.accent)
                    .lineLimit(1)
                    .minimumScaleFactor(0.5)
                Spacer(minLength: scaled(0.04))
                Image(systemName: "wave.3.right")
                    .font(.system(size: scaled(0.052), weight: .semibold))
                    .foregroundStyle(face.foreground.opacity(0.75))
            }

            Spacer(minLength: 0)

            ChipView()
                .frame(width: scaled(0.13), height: scaled(0.098))

            Spacer(minLength: 0)

            if showsDetails {
                HStack(alignment: .bottom) {
                    VStack(alignment: .leading, spacing: scaled(0.018)) {
                        Text(verbatim: "••••  " + face.displayLast4)
                            .font(.system(size: scaled(0.058), weight: .medium, design: .monospaced))
                            .tracking(scaled(0.004))
                            .embossed(on: face.isLightSurface)
                        Text(verbatim: face.displayHolder)
                            .font(.system(size: scaled(0.04), weight: .medium))
                            .tracking(scaled(0.004))
                            .lineLimit(1)
                            .minimumScaleFactor(0.5)
                            .embossed(on: face.isLightSurface)
                    }
                    .foregroundStyle(face.foreground)

                    Spacer(minLength: scaled(0.03))

                    VStack(alignment: .trailing, spacing: scaled(0.012)) {
                        HStack(alignment: .center, spacing: scaled(0.012)) {
                            Text(verbatim: "VALID\nTHRU")
                                .font(.system(size: scaled(0.017), weight: .semibold))
                                .multilineTextAlignment(.trailing)
                                .lineSpacing(0)
                            Text(verbatim: face.expiryText)
                                .font(.system(size: scaled(0.04), weight: .medium, design: .monospaced))
                                .embossed(on: face.isLightSurface)
                        }
                        .foregroundStyle(face.foreground)

                        Text(verbatim: face.networkLabel.uppercased())
                            .font(.system(size: scaled(0.052), weight: .heavy).italic())
                            .foregroundStyle(face.accent)
                            .lineLimit(1)
                            .minimumScaleFactor(0.5)
                    }
                }
            } else {
                Color.clear.frame(height: scaled(0.06))
            }
        }
        .padding(scaled(0.065))
        .frame(width: size.width, height: size.height, alignment: .topLeading)
    }
}

struct EmbossedModifier: ViewModifier {
    let lightSurface: Bool

    func body(content: Content) -> some View {
        content
            .shadow(color: .black.opacity(lightSurface ? 0.25 : 0.55), radius: 0.5, x: 0.6, y: 0.9)
            .shadow(color: .white.opacity(lightSurface ? 0.7 : 0.25), radius: 0.3, x: -0.4, y: -0.6)
    }
}

extension View {
    /// Leichter Präge-Effekt wie bei echten Metallkarten.
    func embossed(on lightSurface: Bool) -> some View {
        modifier(EmbossedModifier(lightSurface: lightSurface))
    }
}

