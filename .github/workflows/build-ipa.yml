name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen
        run: set -o pipefail && xcodebuild -project WalletSim.xcodeproj -target WalletSim -configuration Release -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log

      - name: Als IPA verpacken
        run: mkdir -p Payload && cp -R build/Release-iphoneos/WalletSim.app Payload/ && zip -qry WalletSim.ipa Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WalletSim-ipa
          path: WalletSim.ipa

      - name: Build-Log hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
