import Foundation

/// Wandelt Eingaben wie "1.234,56", "1234.5" oder "12,5" in Double um.
/// Das letzte Komma/der letzte Punkt gilt als Dezimaltrenner, außer es folgen genau drei Ziffern
/// (dann ist es ein Tausenderpunkt, z. B. "1.500").
enum MoneyParser {
    static func parse(_ text: String) -> Double? {
        let digits: ClosedRange<Character> = "0"..."9"
        let chars = Array(text.filter { digits.contains($0) || $0 == "," || $0 == "." })
        guard chars.contains(where: { digits.contains($0) }) else { return nil }

        let lastComma = chars.lastIndex(of: ",")
        let lastDot = chars.lastIndex(of: ".")
        var decimalIndex: Int?

        if let comma = lastComma, let dot = lastDot {
            decimalIndex = max(comma, dot)
        } else if let separatorIndex = lastComma ?? lastDot {
            let separator = chars[separatorIndex]
            let occurrences = chars.filter { $0 == separator }.count
            let digitsAfter = chars.count - separatorIndex - 1
            if occurrences == 1 && digitsAfter != 3 {
                decimalIndex = separatorIndex
            }
        }

        var normalized = ""
        for (index, char) in chars.enumerated() {
            if digits.contains(char) {
                normalized.append(char)
            } else if index == decimalIndex {
                normalized.append(".")
            }
        }
        if normalized.hasSuffix(".") { normalized.removeLast() }
        if normalized.hasPrefix(".") { normalized = "0" + normalized }
        return Double(normalized)
    }

    /// Wert für ein Eingabefeld, ohne Tausenderpunkte: 25000 → "25000", 12.5 → "12,5"
    static func editString(_ value: Double) -> String {
        value.formatted(
            FloatingPointFormatStyle<Double>(locale: Formatters.locale)
                .grouping(.never)
                .precision(.fractionLength(0...2))
        )
    }
}

import SwiftUI
import UIKit

extension Color {
    /// Erwartet "#RRGGBB" oder "RRGGBB".
    init(hex: String) {
        let rgb = HexColor.rgb(from: hex)
        self.init(.sRGB, red: rgb.red, green: rgb.green, blue: rgb.blue, opacity: 1)
    }
}

enum HexColor {
    static func rgb(from hex: String) -> (red: Double, green: Double, blue: Double) {
        var cleaned = hex.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
        if cleaned.hasPrefix("#") { cleaned.removeFirst() }
        guard cleaned.count == 6, let value = UInt32(cleaned, radix: 16) else {
            return (0.5, 0.5, 0.5)
        }
        return (
            Double((value >> 16) & 0xFF) / 255,
            Double((value >> 8) & 0xFF) / 255,
            Double(value & 0xFF) / 255
        )
    }

    static func hex(from color: Color) -> String {
        var red: CGFloat = 0, green: CGFloat = 0, blue: CGFloat = 0, alpha: CGFloat = 0
        UIColor(color).getRed(&red, green: &green, blue: &blue, alpha: &alpha)
        return "#" + twoDigits(red) + twoDigits(green) + twoDigits(blue)
    }

    private static func twoDigits(_ component: CGFloat) -> String {
        let value = Int((min(max(component, 0), 1) * 255).rounded())
        let text = String(value, radix: 16, uppercase: true)
        return text.count == 1 ? "0" + text : text
    }
}

enum GradientMath {
    /// Wandelt einen Winkel (0–360°) in Start/End-Punkte eines LinearGradient.
    static func points(for angle: Double) -> (start: UnitPoint, end: UnitPoint) {
        let radians = angle * .pi / 180
        let dx = cos(radians) / 2
        let dy = sin(radians) / 2
        return (UnitPoint(x: 0.5 - dx, y: 0.5 - dy), UnitPoint(x: 0.5 + dx, y: 0.5 + dy))
    }
}

enum CropMath {
    /// Begrenzt den Versatz so, dass das Bild die Karte immer komplett füllt.
    /// `offset` ist normalisiert (geteilt durch die Kartenbreite).
    static func clamp(offset: CGSize, scale: CGFloat, imageSize: CGSize, frameSize: CGSize) -> CGSize {
        guard imageSize.width > 0, imageSize.height > 0,
              frameSize.width > 0, frameSize.height > 0 else { return .zero }
        let fill = max(frameSize.width / imageSize.width, frameSize.height / imageSize.height)
        let shownWidth = imageSize.width * fill * scale
        let shownHeight = imageSize.height * fill * scale
        let maxX = max(0, (shownWidth - frameSize.width) / 2) / frameSize.width
        let maxY = max(0, (shownHeight - frameSize.height) / 2) / frameSize.width
        return CGSize(
            width: min(max(offset.width, -maxX), maxX),
            height: min(max(offset.height, -maxY), maxY)
        )
    }
}

import Foundation

enum Formatters {
    static let locale = Locale(identifier: "de_DE")

    static func currency(_ value: Double, code: String) -> String {
        value.formatted(.currency(code: code).locale(locale))
    }

    static func currencySymbol(for code: String) -> String {
        let formatter = NumberFormatter()
        formatter.numberStyle = .currency
        formatter.locale = locale
        formatter.currencyCode = code
        return formatter.currencySymbol ?? code
    }

    /// Kurze Achsenbeschriftung: 950 · 1,5 Tsd. · 2 Mio.
    static func axisAmount(_ value: Double) -> String {
        let magnitude = abs(value)
        let style = FloatingPointFormatStyle<Double>(locale: locale).precision(.fractionLength(0...1))
        if magnitude >= 1_000_000 {
            return (value / 1_000_000).formatted(style) + " Mio."
        }
        if magnitude >= 1_000 {
            return (value / 1_000).formatted(style) + " Tsd."
        }
        return value.formatted(FloatingPointFormatStyle<Double>(locale: locale).precision(.fractionLength(0)))
    }

    static func transactionDate(_ date: Date) -> String {
        let calendar = Calendar.current
        let time = date.formatted(.dateTime.hour().minute().locale(locale))
        if calendar.isDateInToday(date) {
            return "Heute, \(time)"
        }
        if calendar.isDateInYesterday(date) {
            return "Gestern, \(time)"
        }
        return date.formatted(.dateTime.weekday(.abbreviated).day().month(.abbreviated).locale(locale))
    }
}

import SwiftUI

struct ContentView: View {
    @Environment(\.scenePhase) private var scenePhase
    @State private var walletViewModel = WalletViewModel()
    @State private var appLock = AppLockViewModel()
    @State private var showSplash = true

    var body: some View {
        ZStack {
            WalletView(
                viewModel: walletViewModel,
                appLock: appLock,
                isRevealed: !showSplash && !appLock.isLocked
            )

            if showSplash {
                SplashView()
                    .transition(.opacity)
                    .zIndex(2)
            }

            if appLock.isLocked {
                LockView(viewModel: appLock)
                    .transition(.opacity)
                    .zIndex(3)
            }
        }
        .environment(\.locale, Formatters.locale)
        .task {
            MotionManager.shared.start()
            try? await Task.sleep(for: .milliseconds(1100))
            withAnimation(.easeOut(duration: 0.4)) {
                showSplash = false
            }
        }
        .onChange(of: scenePhase) { _, phase in
            appLock.handleScenePhase(phase)
            if phase == .active {
                MotionManager.shared.start()
            } else {
                MotionManager.shared.stop()
            }
        }
    }
}

